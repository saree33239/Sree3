<style>
:root{--bg:#f6fbfe;--card:#fff;--tx:#0a2433;--mut:#5f7d8e;--sky:#0ea5e9;--ink:#fff;--soft:#e4f4fc;--line:#d6e9f3;--hero:#0ea5e9;--heroTx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#050607;--card:#0d1114;--tx:#eef8fd;--mut:#7e97a5;--sky:#38bdf8;--ink:#041018;--soft:#0c1b24;--line:#182229;--hero:#0d1114;--heroTx:#eef8fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:100px;transition:background .3s}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir=ltr] .btn svg.i{transform:scaleX(-1)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:720px;margin:auto}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-size:27px;font-weight:900;line-height:1;display:block}
.logo small{display:block;font-size:11px;letter-spacing:3px;color:var(--mut);font-weight:500;margin-top:2px}
.tools{display:flex;gap:8px}
.ic{min-width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer;font:inherit;font-weight:800;font-size:14px;padding:0 12px}
main{padding:0 18px;max-width:720px;margin:auto}
.hero{background:var(--hero);color:var(--heroTx);border-radius:28px;padding:24px 22px 0;overflow:hidden;border:1px solid var(--line)}
.hero svg.route{display:block;width:100%;height:auto}
.hero h1{margin:0 0 2px;font-size:27px;font-weight:900;line-height:1.5}
.tab{display:none}.tab.on{display:block;animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{margin:28px 0 14px}.sec h2{margin:0;font-size:21px;font-weight:800}
.grid{display:grid;gap:16px}
@media(min-width:580px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.card .im{height:170px;background:var(--soft)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:19px;font-weight:800}
.card p{margin:0 0 12px;color:var(--mut);font-size:14px;line-height:1.8;flex:1}
.tag{align-self:flex-start;background:var(--soft);color:var(--sky);font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;color:var(--ink);background:var(--sky);padding:14px 18px;border-radius:16px;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--line)}
.row{display:flex;gap:10px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:44px 18px;border:1.5px dashed var(--line);border-radius:24px;line-height:2;font-size:15px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 8px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:var(--sky)}
textarea{min-height:92px;resize:vertical}
#pw{direction:ltr}html[dir=rtl] #pw{text-align:right}
.up{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;height:160px;border:1.5px dashed var(--sky);border-radius:18px;color:var(--sky);cursor:pointer;overflow:hidden;background:var(--soft);font-weight:700;font-size:14px}
.up img{width:100%;height:100%;object-fit:cover}
.form{padding:6px 18px 20px}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(92%,420px);display:flex;padding:6px;background:color-mix(in srgb,var(--card) 50%,transparent);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid color-mix(in srgb,var(--heroTx) 24%,transparent);border-radius:28px;z-index:6;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--heroTx) 45%,transparent),0 14px 34px color-mix(in srgb,var(--sky) 22%,transparent)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:9px 4px;border-radius:20px;cursor:pointer;transition:.2s}
nav button{position:relative;z-index:1}nav button.on{color:var(--sky)}
#pill{position:absolute;top:6px;left:0;border-radius:22px;z-index:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--heroTx) 30%,transparent),color-mix(in srgb,var(--sky) 26%,transparent));-webkit-backdrop-filter:blur(8px) saturate(170%);backdrop-filter:blur(8px) saturate(170%);border:1px solid color-mix(in srgb,var(--heroTx) 45%,transparent);box-shadow:inset 0 1px 1px color-mix(in srgb,var(--heroTx) 70%,transparent),inset 0 -8px 14px color-mix(in srgb,var(--sky) 18%,transparent),0 8px 20px color-mix(in srgb,var(--sky) 35%,transparent);transition:transform .55s cubic-bezier(.34,1.45,.5,1),width .55s cubic-bezier(.34,1.45,.5,1)}
#pill.mv{animation:sq .5s ease}
@keyframes sq{45%{scale:1.2 .86}}
.modal{position:fixed;inset:0;background:rgba(2,10,16,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .3s}
.sheet:before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0;font-size:22px;font-weight:800}
.opt{display:flex;gap:8px}
.opt label{flex:1;margin:0}
.opt input{display:none}
.opt span{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 4px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;font-weight:700;font-size:14px}
.opt span{transition:transform .4s cubic-bezier(.34,1.45,.5,1),background .3s,box-shadow .3s}
.opt input:checked+span{border-color:color-mix(in srgb,var(--heroTx) 55%,var(--sky));background:linear-gradient(180deg,color-mix(in srgb,var(--heroTx) 35%,transparent),color-mix(in srgb,var(--sky) 24%,transparent));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--sky);transform:scale(1.05);box-shadow:inset 0 1px 1px color-mix(in srgb,var(--heroTx) 70%,transparent),0 8px 18px color-mix(in srgb,var(--sky) 30%,transparent)}
.stats{display:flex;gap:8px;margin:8px 0 12px}
.stats div{flex:1;background:var(--soft);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:22px;color:var(--tx);font-weight:900}
.app{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px}
.app .av{width:42px;height:42px;border-radius:50%;background:var(--sky);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:18px;flex:none}
.app small{color:var(--mut);display:block;margin-top:2px}
h4{margin:20px 0 0;font-size:15px}
.th{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--soft);flex:none}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--sky);background:transparent;color:var(--sky);font:inherit;font-weight:900;font-size:18px;cursor:pointer}.qty b{min-width:18px;text-align:center}
.th.lg{width:80px;height:80px}.chips{flex-wrap:wrap}.chips label{flex:1 1 30%}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:30px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
#ac{display:flex;gap:6px;align-items:center}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px 320px at 90% 8%,color-mix(in srgb,var(--sky) 28%,transparent),transparent 70%),radial-gradient(380px 300px at 5% 55%,color-mix(in srgb,var(--sky) 20%,transparent),transparent 70%),radial-gradient(420px 320px at 80% 95%,color-mix(in srgb,var(--sky) 22%,transparent),transparent 70%)}
.ic{background:color-mix(in srgb,var(--card) 55%,transparent);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--heroTx) 45%,transparent);transition:transform .3s cubic-bezier(.34,1.45,.5,1)}.ic:active{transform:scale(.92)}
.modal{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html[dir=ltr] .btn svg.ph{transform:none}
</style>
</head>

/* ---------- owner / admin ---------- */
function ordersM(pid){const p=P.find(x=>x.id===pid),o=ent(OR[pid]).sort((a,b)=>b.t-a.t);
 open_(`<h3>${esc(p.name)}</h3><h4>${t('orders')} (${o.length})</h4>`+(o.length?o.map(x=>row(x.n,`${esc(x.d)}<br>${t('total')}: ${esc(x.tot)} ${esc(x.cur)}<br><a href="tel:+${esc(x.ph)}" style="color:var(--sky);font-weight:700;direction:ltr;display:inline-block">+${esc(x.ph)}</a>`+(/^https?:/.test(x.a)?`<br><a href="${esc(x.a)}" target="_blank" rel="noopener" style="color:var(--sky);font-weight:700">${t('openMap')}</a>`:'<br>'+esc(x.a))+(x.nt?'<br>'+esc(x.nt):''),x.st,`setOrd('${pid}','${x.id}','${x.uid}','ok')`,`setOrd('${pid}','${x.id}','${x.uid}','no')`)).join(''):em('noOrds'))+cl)}
async function setOrd(pid,oid,uid,s){try{await api('PATCH','orders/'+pid+'/'+oid,{st:s});await api('PATCH','myorders/'+uid+'/'+oid,{st:s});const x=(OR[pid]||{})[oid];if(x)x.st=s;ordersM(pid);load(true)}catch(e){toast(t('delFail')+' ['+e+']')}}
function couriersM(pid){const p=P.find(x=>x.id===pid);
 open_(`<h3>${esc(p.name)}</h3><h4>${t('couriers')} (${CO.length})</h4>`+(CO.length?CO.slice().sort((a,b)=>b.t-a.t).map(x=>row(x.n,cb(x),((HA[x.id]||{})[pid]||{}).st,`setHire('${x.id}','${pid}','ok')`,`setHire('${x.id}','${pid}','no')`)).join(''):em('noApps'))+cl)}
async function setHire(cu,pid,s){const p=P.find(x=>x.id===pid);try{const h={pid,pn:p.name,st:s,t:Date.now()};await api('PUT','hires/'+cu+'/'+pid,h);(HA[cu]=HA[cu]||{})[pid]=h;couriersM(pid);load(true)}catch(e){toast(t('delFail')+' ['+e+']')}}
function prodM(pid){const p=P.find(x=>x.id===pid),l=PR.filter(x=>x.pid===pid);imgP='';
 open_(`<h3>${esc(p.name)}</h3><p style="color:var(--mut);font-size:14px;margin:6px 0 0">${t('menuHint')}</p><h4>${t('prods')} (${l.length})</h4>`+(l.length?l.map(x=>`<div class="app">${im(x)?`<img class="th" src="${im(x)}" alt="">`:'<div class="th"></div>'}<div style="flex:1"><b>${esc(x.name)}</b><div style="display:flex;align-items:center;gap:6px;margin-top:4px"><input type="number" inputmode="decimal" value="${esc(x.price)}" onchange="setPrice('${x.id}',this.value)" style="width:90px;padding:6px 8px"><small style="margin:0">${esc(p.cur||'')}</small></div></div><button class="btn${x.av===false?' o':''}" style="width:auto;padding:8px 12px;font-size:13px" onclick="tgl('${x.id}','${pid}')">${x.av===false?t('nav'):t('avl')}</button><button class="btn o" style="width:auto;padding:8px 12px" onclick="delP('${x.id}','${pid}')">\u2715</button></div>`).join(''):em('noProd'))+`<h4>${t('addP')}</h4><label>${t('pPhoto')}</label><div class="up" id="pup" style="height:110px">${I('cam')}${t('pick')}</div><input type="file" id="pfile" accept="image/*" hidden><label>${t('pname')}</label><input id="pnm"><label>${t('pprice')}</label><input id="ppr" type="number" inputmode="decimal" min="0"><div style="height:16px"></div><button class="btn" onclick="addP('${pid}')">${t('addP')}</button>`+cl);
 $('#pup').onclick=()=>$('#pfile').click();$('#pfile').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,360,d=>{imgP=d;$('#pup').innerHTML=`<img src="${d}" alt="">`})}}
async function addP(pid){const n=$('#pnm').value.trim(),pc=$('#ppr').value.trim();if(!n||pc===''||!imgP)return toast(t('needP'));
 try{const q=await api('POST','imgs',{d:imgP});IMG[q.name]=imgP;await api('POST','products',{pid,name:n,price:pc,imgId:q.name,av:true,t:Date.now()});await load(true);prodM(pid)}catch(e){toast(t('pubFail')+' ['+e+']')}}
async function setPrice(id,v){try{await api('PATCH','products/'+id,{price:v});const x=PR.find(y=>y.id===id);if(x)x.price=v;toast(t('saved'))}catch(e){toast(t('delFail'))}}
async function tgl(id,pid){const x=PR.find(y=>y.id===id);if(!x)return;x.av=x.av===false;try{await api('PATCH','products/'+id,{av:x.av});prodM(pid);load(true)}catch(e){toast(t('delFail'))}}
async function delP(id,pid){try{await api('DELETE','products/'+id);PR=PR.filter(y=>y.id!==id);prodM(pid);load(true)}catch(e){toast(t('delFail'))}}
function accM(pid){const p=P.find(x=>x.id===pid);open_(`<h3>${esc(p.name)}</h3><p style="color:var(--mut)">${p.ownerEmail?t('curOwner')+' <b dir="ltr">'+esc(p.ownerEmail)+'</b>':t('noOwner')}</p><label>${t('email')}</label><input id="oe" dir="ltr" autocapitalize="none"><label>${t('pass')}</label><input id="op" dir="ltr" autocapitalize="none"><div style="height:16px"></div><button class="btn" onclick="mkOwner('${pid}')">${t('mkOwner')}</button>`+cl)}
async function mkOwner(pid){const e=mail($('#oe').value),p=$('#op').value;if(!e||p.length<6)return toast(t('authFill'));try{const j=await authCall('signUp',e,p);await api('PATCH','projects/'+pid,{ownerUid:j.localId,ownerEmail:e});await api('PUT','owners/'+j.localId,true);close_();toast(t('ownerOk'));load(true)}catch(x){toast(ae(x))}}
function del(id){open_(`<h3>${t('delQ')}</h3><div style="height:20px"></div><div class="row"><button class="btn" onclick="delGo('${id}')">${t('del')}</button><button class="btn o" onclick="close_()">${t('close')}</button></div>`)}
async function delGo(id){close_();try{await Promise.all(PR.filter(x=>x.pid===id).map(x=>api('DELETE','products/'+x.id)));await api('DELETE','orders/'+id).catch(()=>{});await api('DELETE','projects/'+id);toast(t('deleted'));load(true)}catch(e){toast(t('delFail')+' ['+e+']')}}
async function save(){if(!isAdm())return;const name=$('#pn').value.trim(),type=$('#pt').value.trim(),desc=$('#pd').value.trim(),w=$('#pw').value.replace(/\D/g,'').replace(/^00/,'');
 if(!img)return toast(t('addPhoto'));if(!name||!type||!desc)return toast(t('need'));if(w&&w.length<8)return toast(t('badWa'));
 try{const q=await api('POST','imgs',{d:img});IMG[q.name]=img;const r=await api('POST','projects',{name,type,desc,cur:$('#pc').value.trim(),wa:w,imgId:q.name,ownerUid:'',t:Date.now()});
  img='';$('#pn').value=$('#pc').value=$('#pd').value=$('#pw').value='';buildTypes();setUp();toast(t('pubOk'));await load(true);prodM(r.name)}catch(e){toast(t('pubFail')+' ['+e+']')}}
/* ---------- ui ---------- */
function setUp(){$('#upbox').innerHTML=img?`<img src="${img}" alt="">`:I('cam')+t('pick')}
function buildTypes(){const tc=t('types'),last=String(tc.length-1);$('#ptc').innerHTML=tc.map((x,i)=>`<label><input type="radio" name="pty" value="${i}"><span>${x}</span></label>`).join('');$('#pt').value='';$('#pt').style.display='none';document.querySelectorAll('[name=pty]').forEach(r=>r.onchange=()=>{const o=r.value===last;$('#pt').style.display=o?'block':'none';$('#pt').value=o?'':tc[r.value]})}
function apply(){const h=document.documentElement;h.lang=lang;h.dir=lang==='ar'?'rtl':'ltr';document.title=lang==='ar'?'\u0633\u0631\u064a\u0639 | saree3':'Saree3 | \u0633\u0631\u064a\u0639';$('#b1').textContent=t('b1');$('#b2').textContent=t('b2');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));buildTypes();$('#lg').textContent=lang==='ar'?'EN':'\u0639\u0631\u0628\u064a';
 $('#cbtn').href='https://wa.me/'+OWNER_WA+'?text='+encodeURIComponent(t('contactMsg'));setUp();render();requestAnimationFrame(()=>pill())}
function setTh(x){document.documentElement.dataset.theme=x;$('#th').innerHTML=I(x==='dark'?'sun':'moon');st.set('s3t',x)}
setTh(st.get('s3t','light')==='dark'?'dark':'light');
$('#th').onclick=()=>setTh(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('#lg').onclick=()=>{lang=lang==='ar'?'en':'ar';st.set('s3l',lang);close_();apply()};
$('#ac').onclick=()=>U?go('own'):authM();
function pill(b){const p=$('#pill'),n=b||document.querySelector('nav button.on');if(!n)return;p.style.width=n.offsetWidth+'px';p.style.height=n.offsetHeight+'px';p.style.transform=`translateX(${n.offsetLeft}px)`;if(b){p.classList.remove('mv');void p.offsetWidth;p.classList.add('mv')}}
addEventListener('resize',()=>pill());
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');pill(b);$('#t-'+b.dataset.t).classList.add('on');scrollTo({top:0,behavior:'smooth'})});
const go=x=>document.querySelector(`[data-t=${x}]`).click();
$('#upbox').onclick=()=>$('#file').click();$('#file').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,480,d=>{img=d;setUp()})};$('#save').onclick=save;
apply();load(true);setInterval(()=>{if(!document.hidden)load()},10000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
try{const f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap';document.head.appendChild(f)}catch(e){}
(function(){const path=$('#rp'),dot=$('#dot'),len=path.getTotalLength(),D=5200;let t0=null;const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function f(ts){if(t0===null)t0=ts;const x=((ts-t0)%D)/D,L=ease(x)*len,pt=path.getPointAtLength(L),p2=path.getPointAtLength(Math.min(len,L+1)),ang=Math.atan2(p2.y-pt.y,p2.x-pt.x)*180/Math.PI,s=(x<.5?4*x:4*(1-x))/2;
dot.setAttribute('transform',`translate(${pt.x} ${pt.y}) rotate(${ang}) scale(${1+s*1.5} ${1-s*.3})`);requestAnimationFrame(f)}
requestAnimationFrame(f)})();
</script>
</body>
